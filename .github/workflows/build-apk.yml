name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Tia Land APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK & Prepare Asset
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/tialand.apk
          mkdir -p public/downloads
          cp dist-apk/tialand.apk public/downloads/tialand.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tialand-apk
          path: dist-apk/tialand.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "أرض تيا — تطبيق الأندرويد الرسمي"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 👑 تطبيق أرض تيا (Tia Land) الرسمي للأندرويد
            
            أهلاً بكم في تطبيق **أرض تيا السحرية (Tia Land)** للأميرة تيا!
            
            ### 💖 مميزات التطبيق:
            - أستوديو أزياء وموضة الأميرات وتصميم الفساتين.
            - مرسم تيا السحري بألوان قوس قزح والنيون والستيكرز.
            - بيانو الأميرات وعزف أحلى الأغاني.
            - لعبة تطابق الذاكرة والنجوم.
            - نادي تيا السري بكود tia.
            
            ### 📲 طريقة التثبيت:
            1. اضغط على رابط التحميل بالأسفل `tialand.apk`.
            2. افتح الملف واختر **تثبيت (Install)**.
          files: dist-apk/tialand.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/downloads/tialand.apk
          git commit -m "chore(apk): update official tialand.apk build [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
